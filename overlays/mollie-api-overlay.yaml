- target: $.info
  update:
    x-apievangelist-notes:
      error_format: >-
        Errors are application/hal+json with status/title/detail/_links, not RFC 9457
        application/problem+json.
      idempotency: >-
        The Idempotency-Key header is declared on all 124 operations; Mollie replays the
        cached response for one hour.
      rate_limits: >-
        429 is declared on all 124 operations. RateLimit and RateLimit-Policy headers are
        returned on every response, Retry-After only on 429.
      deprecation_gap: >-
        Zero operations carry deprecated:true even though the docs discourage the Orders
        API and submit-onboarding-data. Deprecation is prose-only and invisible to an agent
        reading the contract.
      oauth_scope_gap: >-
        The oauth2 securityScheme declares an empty scopes map; the 42 scopes actually used
        appear only in per-operation security requirements. Mollie's RFC 8414 metadata
        publishes 61.
- target: $.components.securitySchemes.oAuth.flows.authorizationCode
  update:
    x-apievangelist-scopes-source: https://my.mollie.com/.well-known/oauth-authorization-server
    x-apievangelist-scopes-published: 61
    x-apievangelist-scopes-used-in-spec: 42
    x-apievangelist-pkce: S256
