notes: >-
  Mollie ships two generations of client libraries. The newer "Mollie's Official SDK"
  family (mollie-api-typescript, mollie-api-py, mollie-api-golang, mollie-api-java,
  mollie-api-csharp) is generated from the OpenAPI 3.1 specification in github.com/mollie/openapi.
  The long-standing hand-written clients (mollie-api-php, mollie-api-ruby) remain the
  primary libraries for their languages. Repositories whose GitHub description says
  "Community Mollie API client" (mollie-api-node, mollie-api-python) are recorded here
  as community, even though they live in the Mollie GitHub organization.
