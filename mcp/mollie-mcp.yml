generated: '2026-08-01'
method: searched
status: published
source: https://docs.mollie.com/docs/mollie-mcp-server
announcement: https://www.mollie.com/news/mollie-launches-ai-ready-mcp-server
server:
  name: mollie
  transport: http
  url: https://mcp.mollie.com/mcp
  official: true
authentication:
  scheme: bearer
  token_type: Mollie advanced access token (access_...) or OAuth 2.0 access token
  env_var: MOLLIE_API_OAUTH_ORG_TOKEN
  minimum_scope: profile.read
  note: Additional per-API scopes are required for the tools that touch those APIs (for example payments.read
    for payment tools). See scopes/mollie-scopes.yml.
  authorization_server: https://my.mollie.com
  protected_resource_metadata: https://mcp.mollie.com/.well-known/oauth-protected-resource
client_config:
  claude_desktop: "{\n  \"mcpServers\": {\n    \"Mollie\": {\n      \"command\": \"npx\",\n      \"args\"\
    : [\n        \"mcp-remote\",\n        \"https://mcp.mollie.com/mcp\",\n        \"--header\",\n   \
    \     \"Authorization: Bearer ${MOLLIE_API_OAUTH_ORG_TOKEN}\"\n      ],\n      \"env\": {\n      \
    \  \"MOLLIE_API_OAUTH_ORG_TOKEN\": \"PUT_YOUR_OWN_ORG_TOKEN_HERE\"\n      }\n    }\n  }\n}\n"
  claude_code_plugin: 'claude plugin marketplace add mollie/ai

    claude plugin install mollie@mollie

    '
api_coverage:
- Balances API
- Captures API
- Customers API
- Invoices API
- Mandates API
- Methods API
- Payments API
- Payment Links API
- Settlements API
- Subscriptions API
- Terminals API
- Webhooks API
- Webhook Events API
