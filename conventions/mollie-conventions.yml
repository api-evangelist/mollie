idempotency:
  supported: true
  header: Idempotency-Key
  value_format: UUID v4 (recommended)
  scope: per request
  retention: 1 hour
  behavior: >-
    If another request is made with the exact same Idempotency-Key value within one hour,
    the Mollie API returns a cached version of the initial response.
  required_on:
  - create-transfer (Business Account Transfers — the Idempotency-Key header is mandatory)
  recommended_on:
  - Recurring payments (sequenceType=recurring) — retry without a key can double-charge
  - Subscription creation — retry without a key can create two subscriptions
  - Partial refunds — retry without a key can execute two separate partial refunds
  spec_coverage: >-
    The idempotency-key header parameter is declared on all 124 operations in the OpenAPI
    document via #/components/parameters/idempotency-key.
  docs: https://docs.mollie.com/reference/api-idempotency
pagination:
  style: cursor
  applies_to: all v2 list endpoints
  request_params:
  - name: limit
    in: query
    default: 50
    maximum: 250
    description: Maximum number of items to return.
  - name: from
    in: query
    description: Object ID to start the result set from, for forward pagination.
  - name: sort
    in: query
    values: [asc, desc]
    default: desc
    description: Direction of the results (desc = older, asc = newer). Supported on some endpoints.
  response_fields:
  - count
  - _embedded
  - _links.self
  - _links.previous
  - _links.next
  - _links.documentation
  rationale: >-
    Paginating by object ID rather than page number so items do not shift when a new
    object is created on the same account mid-traversal.
  docs: https://docs.mollie.com/reference/pagination
