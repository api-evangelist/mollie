error_envelope:
  format: mollie-error-response
  rfc9457: false
  content_type: application/hal+json
  required_fields: [status, title, detail, _links]
  optional_fields: [field]
  field_semantics:
    status: HTTP status code, always identical to the HTTP status of the response.
    title: HTTP reason phrase, e.g. "Not Found".
    detail: Human-readable description of what went wrong.
    field: Name of the request field that caused the issue, when applicable.
    _links.documentation: URL to the Mollie error-handling guide.
  artifact: errors/mollie-problem-types.yml
  docs: https://docs.mollie.com/reference/handling-errors
rate_limiting:
  signalled: true
  status: 429 Too Many Requests
  unit: requests per second, with burst capacity
  dynamic: true
  headers:
  - name: RateLimit-Policy
    returned_in: all responses
    description: Policy name (e.g. get-v2-payments), quota q in req/s, drain window w in seconds,
      and mollie-burst headroom.
  - name: RateLimit
    returned_in: all responses
    description: Current bucket state — policy name, remaining capacity r, seconds until
      drained t, and remaining mollie-burst headroom.
  - name: Retry-After
    returned_in: 429 responses only
    description: Integer seconds until the next request slot opens.
  example: |
    RateLimit-Policy: "get-v2-payments";q=20;w=3;mollie-burst=60
    RateLimit: "get-v2-payments";r=15;t=2;mollie-burst=60
  guidance: Use retry with backoff; avoid repeated bursts; request higher capacity via Mollie.
  rollout: Being rolled out gradually; not yet available on every account.
  docs: https://docs.mollie.com/reference/rate-limiting
