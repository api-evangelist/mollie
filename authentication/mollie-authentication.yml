schemes:
- name: apiKey
  type: http
  scheme: bearer
  in: header
  parameter: Authorization
  sources: [openapi/mollie-openapi-original.yml]
  description: >-
    Authenticates API requests for a single website profile. Each key targets either
    live mode (live_...) or test mode (test_...). Keys are shown only once, at creation,
    and cannot be retrieved afterwards; a lost key must be replaced under Developers →
    API access tokens in the Dashboard and the old one revoked.
  token_prefixes: [live_, test_]
- name: advancedAccessToken
  type: http
  scheme: bearer
  in: header
  parameter: Authorization
  sources: [openapi/mollie-openapi-original.yml]
  description: >-
    Authenticates API requests with configurable permissions. Can access
    organization-level resources and optionally scope to a specific payment profile.
    Intended for advanced integrations such as bookkeeping or reporting tools that need
    fine-grained control. Shown only once at creation. Supports the testmode request
    parameter instead of a separate test key.
  token_prefixes: [access_]
- name: oAuth
  type: oauth2
  sources: [openapi/mollie-openapi-original.yml, https://my.mollie.com/.well-known/oauth-authorization-server]
  description: >-
