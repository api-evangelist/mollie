aid: mollie
name: Mollie
description: 'Mollie B.V. is a Dutch payment service provider headquartered in Amsterdam
  that lets businesses across Europe accept online, point-of-sale and recurring payments
  through a single REST API and hosted checkout. The Mollie API is an HTTP+HAL (application/hal+json)
  interface at api.mollie.com covering Payments, Payment Links, Refunds, Chargebacks,
  Captures, Customers, Mandates, Subscriptions, Methods, Sessions, Terminals, Balances,
  Settlements, Payouts, Invoices, Sales Invoices, Business Accounts, Transfers, Onboarding,
  Capabilities, Clients, Client Links, Profiles, Organizations, Permissions, Delayed
  Routing, Verify Payee, Wallets, Webhooks and Webhook Events. Mollie supports European
  payment methods including iDEAL, Bancontact, SEPA Direct Debit, Klarna, PayPal, Apple
  Pay, Google Pay, BLIK, Przelewy24, TWINT, Vipps, MobilePay, Swish and cards. Mollie
  publishes an OpenAPI 3.1 specification, official SDKs for PHP, Node/TypeScript, Python,
  Ruby, Go, Java and C#/.NET, an OAuth 2.0 Connect platform for marketplaces, next-gen
  webhook subscriptions, and a hosted Model Context Protocol server plus an official
  agent toolkit and Agent Skill for AI-driven integrations.'
