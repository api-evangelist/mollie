- aid: mollie:mollie-mcp
  name: Mollie MCP Server
  description: 'Mollie''s official hosted Model Context Protocol server at mcp.mollie.com/mcp.
    It exposes Mollie API capabilities to AI agents over streamable HTTP, authenticated
    with an OAuth 2.0 advanced access token (Bearer) requiring at minimum the profile.read
    scope. Coverage spans the Balances, Captures, Customers, Invoices, Mandates, Methods,
    Payments, Payment Links, Settlements, Subscriptions, Terminals, Webhooks and Webhook
    Events APIs. Anonymous tools/list is refused with a 401 and an RFC 9728 oauth-protected-resource
    challenge pointing at my.mollie.com as the authorization server.'
  humanURL: https://docs.mollie.com/docs/mollie-mcp-server
  baseURL: https://mcp.mollie.com/mcp
