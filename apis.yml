apis:
- aid: mollie:mollie-api
  name: Mollie API
  description: 'The Mollie API is a REST API using HAL (application/hal+json) over
    HTTPS at api.mollie.com. It covers 124 documented operations across 33 API groups
    — Payments, Payment Links, Refunds, Chargebacks, Captures, Customers, Mandates,
    Subscriptions, Methods, Sessions, Terminals, Balances, Settlements, Payouts, Invoices,
    Sales Invoices, Business Accounts, Transfers, Verify Payee, Onboarding, Capabilities,
    Clients, Client Links, Profiles, Organizations, Permissions, Delayed Routing, Wallets,
    Balance Transfers, Unmatched Credit Transfers, Webhooks, Webhook Events and OAuth.
    Authentication is by bearer API key (test_/live_ prefixed), advanced access token
    (access_ prefixed) or OAuth 2.0 authorization code with 60+ scopes. Every operation
    accepts an Idempotency-Key header, and list endpoints use cursor pagination.'
  humanURL: https://docs.mollie.com/reference/overview
